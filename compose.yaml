services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ecommerce_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  projeto-dados:
    build: .
    container_name: projeto-dados
    environment:
      DB_HOST: postgres
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: ecommerce_db
      DB_PORT: 5432
    depends_on:
      - postgres
    volumes:
      - ./data:/app/data
      - ./src:/app/src

  dashboard:
    build: .
    container_name: dashboard-streamlit
    command: poetry run streamlit run src/dashboard/app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      PYTHONPATH: /app
      DB_HOST: postgres
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: ecommerce_db
      DB_PORT: 5432
    depends_on:
      - postgres
    volumes:
      - ./src:/app/src

volumes:
  postgres_data: