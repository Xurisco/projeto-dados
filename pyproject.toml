[project]
name = "projeto-dados"
version = "0.1.0"
description = ""
authors = [
    {name = "Arthur Klein", email = "arthurklein777.ak@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["pydantic (>=2.13.4,<3.0.0)", "faker (>=40.37.0,<41.0.0)", "email-validator (>=2.3.0,<3.0.0)", "pandas (>=3.0.5,<4.0.0)", "sqlalchemy (>=2.0.52,<3.0.0)", "psycopg2-binary (>=2.9.12,<3.0.0)", "openpyxl (>=3.1.5,<4.0.0)", "streamlit (>=1.62.0,<2.0.0)", "plotly (>=7.0.0,<8.0.0)"]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]
[tool.pytest.ini_options]
pythonpath = ["."]